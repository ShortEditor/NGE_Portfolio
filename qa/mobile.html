<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NGE — mobile layout test</title><style>body{margin:0;background:#242424;font:14px system-ui;color:white;display:grid;place-items:center;padding:15px;gap:12px}iframe{width:375px;height:812px;border:1px solid #777}label{display:flex;align-items:center;gap:12px}select{font:inherit;padding:5px}</style></head><body><label>Viewport <select id="size"><option value="375,812">375 × 812</option><option value="320,640">320 × 640</option><option value="768,1024">768 × 1024</option><option value="1440,900">1440 × 900</option></select></label><iframe id="preview" title="Mobile portfolio preview" src="/"></iframe><script>document.querySelector('#size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const f=document.querySelector('#preview');f.style.width=w+'px';f.style.height=h+'px'});</script></body></html>
